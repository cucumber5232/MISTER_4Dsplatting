# Default training options for a real take on GPU.
# Every key of mister4d.trainer.TrainConfig can be set here; anything omitted
# keeps its default. Override single values from the command line with
#   mister4d train <data> --out <run> --config configs/default.yaml --set iterations=30000

# All visible GPUs are used: each one renders a different instant per step.
devices: auto
views_per_step: 4        # cameras per GPU and per step
cache_gb: 16             # RAM for decoded frames; raise it if the take fits in memory

# -1 = 250 steps per frame of the take (at least 7000). Every frame has its own
# Gaussians, so longer takes need proportionally more steps.
iterations: -1
segment_frames: 60        # a longer take is trained in segments of about this many frames (0 = never)
segment_overlap: 2        # frames of context a segment sees beyond each of its ends

# Few cameras cannot constrain view-dependent colour: keep 0 below ~8 cameras,
# try 1-2 with a full ring.
sh_degree: 0

max_gaussians: 2000000

# Every Gaussian loses this share of its opacity each time it is drawn: those the
# images need win it back, the others fade and are removed. Higher values (0.015)
# give fewer Gaussians and steadier in-between views, but softer filmed views.
opacity_decay: 0.005

# Shape of the Gaussians. A needle (far longer in one direction than in the other
# two) hides along the line of sight of one camera and shows as a streak from
# anywhere else; a Gaussian thinner than a pixel of the training images shows as
# a hair when the view is enlarged. 0 switches either off.
lambda_needle: 0.02
min_scale_pixels: 0.5

# Keep removing the Gaussians that fade after densification has stopped.
prune_to_end: true

# Cameras without hardware trigger / genlock: also learn, per camera, the
# sub-frame time offset left after 'ingest' aligned them to the nearest frame.
learn_time_offsets: false

# Cameras that do not render colours alike (different models, automatic exposure
# or white balance): also learn, per camera, a gain for red, green and blue.
learn_camera_colors: false

# The whole scene, set included, without masks (needs 'mister4d init --full-scene').
# The empty set is reconstructed first, as a static scene, then the take on top of it.
full_scene: false
scenery_iterations: -1       # -1 = 7000
scenery_max_gaussians: 1500000
