<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MISTER 4D Player</title>
<style>
  :root {
    --bg: #101216; --panel: rgba(22, 25, 31, 0.86); --line: rgba(255, 255, 255, 0.12);
    --text: #e9ecf1; --muted: #9aa3b2; --accent: #8f7ae6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(8px); }
  #info { top: 14px; left: 14px; padding: 10px 14px; max-width: min(360px, calc(100vw - 28px)); }
  #info h1 { margin: 0 0 2px; font-size: 14px; font-weight: 650; letter-spacing: 0.02em; }
  #info p { margin: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #bar { left: 14px; right: 14px; bottom: 14px; padding: 10px 12px; display: flex; flex-wrap: wrap;
    align-items: center; gap: 10px 12px; }
  #bar button, #bar select { background: rgba(255, 255, 255, 0.06); color: var(--text);
    border: 1px solid var(--line); border-radius: 7px; height: 32px; padding: 0 10px; font: inherit; }
  #bar button { min-width: 74px; cursor: pointer; }
  #bar button:hover, #bar select:hover { border-color: var(--accent); }
  #bar button:focus-visible, #bar select:focus-visible, #time:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #time { flex: 1 1 180px; min-width: 120px; accent-color: var(--accent); }
  #frame { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  #help { color: var(--muted); font-size: 12px; flex-basis: 100%; }
  #message { top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 14px 18px; text-align: center;
    max-width: min(460px, calc(100vw - 28px)); }
  #message:empty { display: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="gl" aria-label="Scena 4D"></canvas>
<div id="info" class="panel">
  <h1>MISTER 4D Player</h1>
  <p id="stats">caricamento…</p>
</div>
<div id="message" class="panel" role="status"></div>
<div id="bar" class="panel">
  <button id="play" type="button">Pausa</button>
  <input id="time" type="range" min="0" max="0" value="0" step="1" aria-label="Istante">
  <span id="frame">0 / 0</span>
  <select id="speed" aria-label="Velocità">
    <option value="0.25">0,25×</option>
    <option value="0.5">0,5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
  </select>
  <select id="camera" aria-label="Punto di vista"></select>
  <button id="background" type="button">Sfondo</button>
  <span id="help">Trascina: ruota · Rotella: zoom · Shift + trascina o tasto destro: sposta · Spazio: play/pausa</span>
</div>
<script src="viewer.js"></script>
</body>
</html>
